<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b32">
  <title>部活OCR | 資料を文字に変換</title>
  <style>
    :root { color-scheme: light; --green:#173b32; --green2:#24594a; --mint:#e9f3ed; --paper:#f6f8f5; --ink:#1d2924; --muted:#66736c; --line:#dce5de; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; background:var(--paper); color:var(--ink); }
    header { background:var(--green); color:white; padding:22px 18px; }
    .header-inner, main { width:min(920px,100%); margin:0 auto; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { display:grid; place-items:center; width:42px; height:42px; border-radius:13px; background:#ffffff1c; font-size:23px; }
    h1 { margin:0; font-size:20px; letter-spacing:.02em; }
    header p { margin:4px 0 0; color:#d7e6dc; font-size:13px; }
    main { padding:24px 16px 44px; }
    .intro { margin-bottom:20px; }
    .intro h2 { margin:0 0 8px; font-size:24px; }
    .intro p { margin:0; color:var(--muted); line-height:1.7; font-size:14px; }
    .layout { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    .card { background:white; border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 5px 18px #173b3208; min-width:0; }
    .card h3 { margin:0 0 6px; font-size:16px; }
    .hint { color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 16px; }
    .drop { border:1.5px dashed #9ab5a4; background:#f8fbf8; border-radius:14px; padding:22px 14px; text-align:center; cursor:pointer; display:block; }
    .drop:hover { border-color:var(--green2); background:var(--mint); }
    .drop .symbol { font-size:30px; margin-bottom:8px; }
    .drop strong { display:block; font-size:14px; }
    .drop small { display:block; color:var(--muted); margin-top:6px; }
    input[type=file] { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
    .preview-wrap { margin-top:14px; display:none; }
    .preview-wrap img { display:block; width:100%; max-height:300px; object-fit:contain; border-radius:10px; background:#f0f2f0; }
    button { font:inherit; cursor:pointer; border:0; border-radius:11px; padding:12px 15px; font-weight:650; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .primary { width:100%; background:var(--green); color:white; margin-top:14px; }
    .primary:hover:not(:disabled) { background:var(--green2); }
    .secondary { background:var(--mint); color:var(--green); }
    .result-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
    .result-head h3 { margin:0; }
    textarea { width:100%; min-height:260px; resize:vertical; border:1px solid var(--line); border-radius:12px; padding:13px; font:14px/1.75 inherit; font-family:inherit; color:var(--ink); outline-color:#82a994; }
    .status { display:none; margin-top:13px; padding:11px 12px; border-radius:10px; background:var(--mint); color:var(--green); font-size:13px; line-height:1.6; }
    .status.error { display:block; background:#fff0ed; color:#922d20; }
    .status.visible { display:block; }
    .progress { height:5px; background:#e8eee9; border-radius:8px; overflow:hidden; margin-top:10px; display:none; }
    .progress span { display:block; height:100%; width:0; background:#4c8b6b; transition:width .2s; }
    .privacy { margin-top:16px; border-radius:12px; background:#edf2ee; padding:13px 14px; font-size:12px; color:#4f6256; line-height:1.7; }
    footer { text-align:center; color:var(--muted); font-size:12px; padding:0 16px 24px; }
    @media (max-width:680px) { .layout { grid-template-columns:1fr; } main { padding-top:20px; } .intro h2 { font-size:22px; } .card { padding:17px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner brand">
      <div class="logo" aria-hidden="true">▤</div>
      <div><h1>部活OCR</h1><p>プリントや資料を、編集できる文字に</p></div>
    </div>
  </header>
  <main>
    <section class="intro">
      <h2>資料を文字に変換しよう</h2>
      <p>写真や画像を選んで「文字を読み取る」を押してください。読み取った文字は、あとから自由に編集・コピーできます。</p>
    </section>
    <div class="layout">
      <section class="card">
        <h3>① 画像を選ぶ</h3>
        <p class="hint">文字がはっきり写った画像がおすすめです。JPG・PNGなどに対応しています。</p>
        <label class="drop" for="imageInput">
          <div class="symbol" aria-hidden="true">＋</div>
          <strong>画像を選択する</strong>
          <small>クリックして写真・画像をアップロード</small>
        </label>
        <input id="imageInput" type="file" accept="image/*">
        <div class="preview-wrap" id="previewWrap"><img id="preview" alt="選択した画像のプレビュー"></div>
        <button class="primary" id="readButton" disabled>文字を読み取る</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="progress" id="progress"><span id="progressBar"></span></div>
        <div class="privacy">🔒 読み取りはこのブラウザ上で行う設計です。画像を共有データベースに保存する機能や部員ログインは、次の段階で追加します。</div>
      </section>
      <section class="card">
        <div class="result-head"><h3>② 読み取り結果</h3><button class="secondary" id="copyButton" type="button">コピー</button></div>
        <p class="hint">読み取り結果はここで修正できます。文字が正しく認識されない場合は、画像を明るくして撮り直してみてください。</p>
        <textarea id="result" placeholder="読み取った文字がここに表示されます…" aria-label="読み取り結果"></textarea>
        <button class="secondary" id="clearButton" type="button" style="margin-top:10px">結果を消去</button>
      </section>
    </div>
  </main>
  <footer>部活OCR · 試作版</footer>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const previewWrap = document.getElementById('previewWrap');
    const readButton = document.getElementById('readButton');
    const result = document.getElementById('result');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');
    let selectedFile = null;
    let isReading = false;

    function setStatus(message, error = false) {
      status.textContent = message;
      status.className = 'status visible' + (error ? ' error' : '');
    }
    imageInput.addEventListener('change', () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        setStatus('画像ファイルを選んでください。', true);
        return;
      }
      selectedFile = file;
      preview.src = URL.createObjectURL(file);
      previewWrap.style.display = 'block';
      readButton.disabled = false;
      setStatus('画像を選択しました。「文字を読み取る」を押してください。');
    });

    readButton.addEventListener('click', async () => {
      if (!selectedFile || isReading) return;
      if (!window.Tesseract) {
        setStatus('OCR機能を読み込めませんでした。インターネット接続を確認してページを再読み込みしてください。', true);
        return;
      }
      isReading = true;
      readButton.disabled = true;
      progress.style.display = 'block';
      progressBar.style.width = '0%';
      setStatus('OCRエンジンを準備しています。初回は言語データの読み込みに時間がかかります。');
      try {
        const worker = await Tesseract.createWorker('jpn+eng', 1, {
          logger: message => {
            if (message.status) {
              const pct = Math.round((message.progress || 0) * 100);
              setStatus('文字を読み取り中… ' + message.status + (message.progress != null ? ' (' + pct + '%)' : ''));
              progressBar.style.width = pct + '%';
            }
          }
        });
        const { data: { text } } = await worker.recognize(selectedFile);
        await worker.terminate();
        result.value = text.trim();
        setStatus(result.value ? '読み取りが完了しました。結果を確認して、必要なら修正してください。' : '文字を読み取れませんでした。画像を明るくして、もう一度試してください。', !result.value);
        progressBar.style.width = '100%';
      } catch (error) {
        setStatus('読み取りに失敗しました。インターネット接続を確認し、画像を選び直して試してください。', true);
        console.error(error);
      } finally {
        isReading = false;
        readButton.disabled = !selectedFile;
        progress.style.display = 'none';
      }
    });

    document.getElementById('copyButton').addEventListener('click', async () => {
      if (!result.value) { setStatus('コピーする文字がありません。', true); return; }
      try {
        await navigator.clipboard.writeText(result.value);
        setStatus('読み取り結果をコピーしました。');
      } catch {
        result.focus();
        result.select();
        setStatus('文字を選択しました。Macなら Command + C でコピーできます。');
      }
    });
    document.getElementById('clearButton').addEventListener('click', () => {
      result.value = '';
      setStatus('読み取り結果を消去しました。');
    });
  </script>
</body>
</html>
